<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduDiário — ERP Escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: barra superior com perfis; à esquerda turmas/aulas, à direita o trabalho do dia. */
  --ink:#16223b;
  --paper:#f4f5f2;
  --surface:#ffffff;
  --line:#dfe2dc;
  --muted:#5d6676;
  --accent:#1f6f6a;
  --accent-soft:#e2f0ee;
  --mark:#d98e1c;
  --mark-soft:#fbf0dc;
  --ok:#2f7d3e; --ok-soft:#e5f3e7;
  --bad:#b33a2e; --bad-soft:#f8e4e1;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-doc:"Source Serif 4", Georgia, "Times New Roman", serif;
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e7ebf2; --paper:#11161f; --surface:#19202b; --line:#2b3442; --muted:#9aa4b4;
    --accent:#5cc2b8; --accent-soft:#16312f; --mark:#f0b04a; --mark-soft:#3a2c14;
    --ok:#6fc27f; --ok-soft:#183020; --bad:#f08a7e; --bad-soft:#3b1c19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e7ebf2; --paper:#11161f; --surface:#19202b; --line:#2b3442; --muted:#9aa4b4;
  --accent:#5cc2b8; --accent-soft:#16312f; --mark:#f0b04a; --mark-soft:#3a2c14;
  --ok:#6fc27f; --ok-soft:#183020; --bad:#f08a7e; --bad-soft:#3b1c19; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;min-height:100%}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;margin-right:8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--surface);font-family:var(--font-display);font-weight:700}
.brand b{font-family:var(--font-display);font-size:18px}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.tab:hover{background:var(--paper);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.badge{background:var(--mark);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
main{flex:1;padding:20px;max-width:1280px;width:100%;margin:0 auto}
.demo-note{background:var(--mark-soft);border:1px solid color-mix(in srgb,var(--mark) 40%,transparent);padding:10px 14px;border-radius:var(--radius);margin-bottom:16px;font-size:14px}
.layout{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{font-size:17px}
.panel-b{padding:16px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.side-sec{padding:12px 12px 4px}
.select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.turma{margin:10px 0 4px;font-weight:700;font-size:14px;padding:0 4px}
.turma span{color:var(--muted);font-weight:500}
.aula-item{display:grid;grid-template-columns:48px 1fr;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:8px;border-radius:8px;margin-bottom:2px}
.aula-item:hover{background:var(--paper)}
.aula-item[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.date-chip{font-family:var(--font-display);text-align:center;line-height:1.05;border-radius:8px;background:var(--paper);padding:5px 0;font-size:18px;font-weight:700}
.date-chip small{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-family:var(--font-body);font-weight:700;letter-spacing:.05em}
.aula-item .t{font-weight:600;font-size:14px}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--paper);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--mark-soft);color:var(--mark)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ac{background:var(--accent-soft);color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:16px}
.aula-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.aula-head h1{font-size:26px}
.sub{color:var(--muted)}
.material{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.file-ic{width:44px;height:52px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:11px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
details.extract{margin-top:12px}
details.extract summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
details.extract pre{white-space:pre-wrap;font-family:var(--font-body);font-size:13px;background:var(--paper);padding:12px;border-radius:8px;max-height:260px;overflow:auto;margin:8px 0 0}
table.chamada{width:100%;border-collapse:collapse}
table.chamada th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.chamada td{padding:7px 8px;border-bottom:1px solid var(--line)}
table.chamada tr:last-child td{border-bottom:0}
table.chamada tr.falta td{background:var(--bad-soft)}
.num{font-variant-numeric:tabular-nums;color:var(--muted);width:32px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].p{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].f{background:var(--bad);color:#fff}
.seg button:disabled{cursor:default}
.foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface)}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.run .dot{border-color:var(--accent);color:var(--accent)}
.step.run .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
.step.err .dot{background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes pulse{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.step.run .dot::after{animation:none}}
.step .st{font-weight:600}
.step .sd{color:var(--muted);font-size:13px}
.stream{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--paper);border-radius:8px;padding:10px;max-height:120px;overflow:hidden;color:var(--muted);white-space:pre-wrap;word-break:break-all;margin-top:6px;mask-image:linear-gradient(to bottom,transparent,black 40%)}
.alert{padding:10px 14px;border-radius:8px;font-size:14px}
.alert.err{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--mark-soft)}
.alert.ok{background:var(--ok-soft)}
/* Secretaria */
.mail{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:520px}
@media (max-width:860px){.mail{grid-template-columns:1fr}}
.mail-list{border-right:1px solid var(--line)}
.mail-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 16px}
.mail-item:hover{background:var(--paper)}
.mail-item[aria-current="true"]{background:var(--accent-soft)}
.mail-item.unread .mi-s{font-weight:700}
.mail-item.unread::before{content:"";float:left;width:8px;height:8px;border-radius:50%;background:var(--mark);margin:6px 8px 0 -10px}
.mi-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.mi-s{font-size:14px;margin:2px 0}
.mi-p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-view{padding:20px 24px}
.mail-view h2{font-size:20px;margin-bottom:8px}
.hdr{font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-bottom:16px}
.mail-body{white-space:pre-line;max-width:65ch;margin-bottom:18px}
.attach{display:flex;gap:10px;flex-wrap:wrap}
.att{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-width:250px}
.att .pdf{width:30px;height:36px;border-radius:4px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.att .n{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.att>div:nth-child(2){min-width:0;flex:1}
.att .m{font-size:12px;color:var(--muted)}
.att-actions{display:flex;gap:6px;margin-left:auto}
.empty{color:var(--muted);text-align:center;padding:60px 20px}
/* Painel */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.tile .v{font-family:var(--font-display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .k{color:var(--muted);font-size:13px}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line)}
table.list td{padding:9px 12px;border-bottom:1px solid var(--line)}
.scroll-x{overflow-x:auto}
/* Padrão */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.field .h{font-size:12.5px;color:var(--muted);margin-top:3px}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.part{border:1px solid var(--line);border-radius:var(--radius);padding:14px;border-top:4px solid var(--accent)}
.part:nth-child(2){border-top-color:var(--mark)}
.part:nth-child(3){border-top-color:#7a5cc2}
.part:nth-child(4){border-top-color:var(--ok)}
.part:nth-child(5){border-top-color:var(--muted)}
.part b{display:block;font-family:var(--font-display);margin-bottom:4px}
.part p{margin:0;font-size:13.5px;color:var(--muted)}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal-card{background:var(--surface);border-radius:12px;width:min(880px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-bar{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:-24px;background:var(--surface);border-radius:12px 12px 0 0;flex-wrap:wrap;z-index:2}
.modal-bar h3{font-size:16px}
.modal-body{padding:20px;background:#d9dcd6;border-radius:0 0 12px 12px;overflow-x:auto}
.small-modal{width:min(440px,100%)}
.small-modal .modal-body{background:var(--surface);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;font-size:14px;max-width:90vw}
/* ===== Apostila (documento impresso — sempre claro) ===== */
.doc{width:794px;max-width:100%;margin:0 auto;background:#fff;color:#1b1b1b;font-family:var(--font-doc);font-size:13.5px;line-height:1.55;padding:48px 56px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.doc.export{width:700px;max-width:none;padding:0;box-shadow:none}
.doc h1,.doc h2,.doc h3{font-family:var(--font-doc);color:#16223b;letter-spacing:0}
.doc-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1f6f6a;padding-bottom:8px;margin-bottom:14px}
.doc-top .esc{font-family:var(--font-body);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#1f6f6a}
.doc-top h1{font-size:22px;margin-top:2px}
.doc-top .tag{font-family:var(--font-body);font-size:11px;border:1px solid #1f6f6a;color:#1f6f6a;padding:3px 8px;border-radius:4px;font-weight:700;white-space:nowrap}
.info{width:100%;border-collapse:collapse;font-family:var(--font-body);font-size:12.5px;margin-bottom:14px}
.info td{border:1px solid #c9ccc6;padding:5px 8px;vertical-align:top}
.info td b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#5d6676}
.info .aluno{font-size:15px;font-weight:700}
.instr{background:#f1f6f5;border-left:4px solid #1f6f6a;padding:10px 14px;font-family:var(--font-body);font-size:13px;margin-bottom:18px}
.parte{font-family:var(--font-body);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#fff;background:#16223b;display:inline-block;padding:3px 10px;border-radius:3px;margin:22px 0 6px}
.doc h2{font-size:18px;margin:0 0 10px}
.doc h3{font-size:14.5px;margin:12px 0 4px}
.doc p{margin:0 0 8px}
.doc ul{margin:4px 0 10px;padding-left:20px}
.conceitos{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.conceitos td{border-bottom:1px solid #dcdfd8;padding:5px 6px;vertical-align:top}
.conceitos td:first-child{font-weight:700;width:32%;font-family:var(--font-body)}
.q{margin:0 0 14px}
.q .en{font-weight:600}
.q .en span{font-family:var(--font-body);font-weight:700;color:#1f6f6a;margin-right:4px}
.alts{list-style:none;padding:0;margin:6px 0 0 18px;display:grid;gap:3px}
.alts li{display:grid;grid-template-columns:24px 1fr;align-items:start}
.alts li b{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid #444;border-radius:50%;font-family:var(--font-body);font-size:10.5px;margin-top:2px}
.lines{margin:8px 0 0}
.lines div{border-bottom:1px solid #b9bdb5;height:26px}
.mm{margin-top:6px}
.mm svg{width:100%;height:auto;display:block}
.gabarito{margin-top:28px;border-top:2px dashed #999;padding-top:16px}
.gab-tag{font-family:var(--font-body);font-size:11px;color:#b33a2e;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.gab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;font-family:var(--font-body);margin:8px 0 12px}
.gab-grid div{border:1px solid #c9ccc6;border-radius:4px;padding:4px 8px;text-align:center}
.doc .exp{font-size:12.5px;color:#444}
.doc-foot{margin-top:24px;font-family:var(--font-body);font-size:11px;color:#777;border-top:1px solid #ddd;padding-top:6px;display:flex;justify-content:space-between}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ===== Provas e correção ===== */
.steptabs{display:flex;gap:6px;flex-wrap:wrap}
.steptab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.steptab[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qcard{border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px}
.qcard .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qcard .qh b{font-family:var(--font-display)}
.qcard textarea,.qcard input[type=text],.qcard input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:14px}
.qcard textarea{resize:vertical;min-height:48px}
.alt-row{display:grid;grid-template-columns:auto 26px 1fr;gap:8px;align-items:center}
.alt-row input[type=radio]{width:16px;height:16px;accent-color:var(--ok)}
.crit-row{display:grid;grid-template-columns:1fr 80px auto;gap:8px;align-items:center}
.ptsin{width:80px !important}
.prova-list-item{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:9px 10px;border-radius:8px;margin-bottom:2px}
.prova-list-item:hover{background:var(--paper)}
.prova-list-item[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.rev{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
@media (max-width:980px){.rev{grid-template-columns:1fr}}
.rv-item{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 12px;font-size:14px}
.rv-item:hover{background:var(--paper)}
.rv-item[aria-current="true"]{background:var(--accent-soft)}
.rv-item .nt{font-variant-numeric:tabular-nums;font-weight:700}
.thumb{width:120px;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;background:#fff}
.crop{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.transc{background:var(--paper);border-radius:8px;padding:10px 12px;font-size:15px;white-space:pre-wrap}
.transc mark{background:var(--mark-soft);color:var(--mark);font-weight:700;border-radius:3px;padding:0 3px}
.crit-list{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:14px}
.crit-list li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.dcard{border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.dcard.attn{border-color:var(--mark);box-shadow:inset 4px 0 0 var(--mark)}
.nota-in{width:90px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-weight:700;font-size:15px}
.fila{display:grid;gap:6px;margin-top:12px}
.fila div{display:flex;gap:10px;align-items:center;font-size:14px;background:var(--paper);border-radius:8px;padding:8px 12px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

const MAT_FOTOSSINTESE = `Fotossíntese — Aula 20/10 — 1º ano A — Profª Marina Costa

1. O que é fotossíntese
A fotossíntese é o processo pelo qual plantas, algas e algumas bactérias (como as cianobactérias) produzem matéria orgânica a partir de gás carbônico (CO2) e água (H2O), usando a energia da luz. O produto principal é a glicose (C6H12O6), e o oxigênio (O2) é liberado como subproduto.
Equação geral: 6 CO2 + 6 H2O + luz → C6H12O6 + 6 O2

2. Onde ocorre
Nas células vegetais, a fotossíntese ocorre nos cloroplastos, organelas que contêm clorofila, o pigmento verde que absorve principalmente a luz azul e a vermelha. O cloroplasto tem membranas internas empilhadas, os tilacoides (que formam os grana), mergulhadas em um líquido chamado estroma.

3. Etapa fotoquímica (fase clara)
Acontece nas membranas dos tilacoides e depende diretamente da luz. A luz excita a clorofila; ocorre a fotólise da água (quebra da molécula de água), que libera O2, prótons e elétrons. A energia é armazenada em ATP e NADPH.

4. Etapa química (fase escura ou Ciclo de Calvin)
Acontece no estroma e não depende diretamente da luz, mas usa o ATP e o NADPH produzidos na fase clara. O CO2 do ar é fixado pela enzima Rubisco e transformado em glicose.

5. Fatores que influenciam a taxa de fotossíntese
Intensidade luminosa, concentração de CO2 e temperatura. Até certo ponto, aumentar esses fatores aumenta a taxa; acima de um limite, a taxa estabiliza (luz e CO2) ou cai (temperatura alta desnatura enzimas).
Ponto de compensação luminoso: intensidade de luz em que a fotossíntese é igual à respiração; a planta não ganha nem perde matéria orgânica.

6. Importância
A fotossíntese é a base das cadeias alimentares (produtores), renova o oxigênio da atmosfera e retira CO2 do ar, ajudando a regular o clima.`;

const MAT_RESPIRACAO = `Respiração Celular — Aula 27/10 — 1º ano A — Profª Marina Costa

1. Conceito
Respiração celular é o processo em que a célula quebra moléculas orgânicas, principalmente a glicose, para liberar a energia nelas armazenada e guardá-la na forma de ATP (adenosina trifosfato), a "moeda energética" da célula.
Equação geral (respiração aeróbica): C6H12O6 + 6 O2 → 6 CO2 + 6 H2O + energia (até cerca de 30 a 32 ATP)

2. Etapas da respiração aeróbica
a) Glicólise — ocorre no citoplasma (citosol). A glicose (6 carbonos) é quebrada em duas moléculas de piruvato (ácido pirúvico, 3 carbonos). Saldo: 2 ATP e 2 NADH. Não precisa de oxigênio.
b) Ciclo de Krebs (ciclo do ácido cítrico) — ocorre na matriz da mitocôndria. O piruvato é transformado em acetil-CoA, que entra no ciclo. Libera CO2 e produz NADH, FADH2 e 2 ATP.
c) Cadeia respiratória (cadeia transportadora de elétrons e fosforilação oxidativa) — ocorre nas cristas mitocondriais (membrana interna). Os elétrons do NADH e FADH2 passam por proteínas até o oxigênio, aceptor final, formando água. É a etapa que mais produz ATP, por meio da enzima ATP sintase.

3. Fermentação
Quando não há oxigênio suficiente, algumas células fazem fermentação: só a glicólise produz ATP (saldo de 2 ATP).
- Fermentação lática: piruvato vira ácido lático. Ocorre em bactérias (produção de iogurte) e em músculos humanos em esforço intenso.
- Fermentação alcoólica: piruvato vira etanol e CO2. Feita por leveduras; usada na produção de pão, cerveja e vinho.

4. Comparação com a fotossíntese
A respiração consome O2 e glicose e libera CO2 e água; a fotossíntese faz o inverso. A respiração acontece em todas as células vivas, dia e noite, inclusive nas plantas.

5. Mitocôndria
Organela de dupla membrana; a interna forma dobras chamadas cristas, que aumentam a superfície para a cadeia respiratória. Possui DNA próprio.`;

1. Contexto
A Revolução Industrial começou na Inglaterra, na segunda metade do século XVIII (por volta de 1760). Marcou a passagem da produção artesanal e manufatureira para a produção mecanizada em fábricas.

2. Por que a Inglaterra?
- Acúmulo de capital vindo do comércio colonial e do mercantilismo.
- Grandes reservas de carvão mineral e ferro.
- Cercamentos (enclosures): camponeses expulsos das terras comuns migraram para as cidades, formando mão de obra barata.
- Estabilidade política após a Revolução Gloriosa (1688) e uma burguesia forte.

3. Fases
Primeira Revolução Industrial (c. 1760–1850): máquina a vapor (aperfeiçoada por James Watt), indústria têxtil, carvão, ferrovias.
Segunda Revolução Industrial (c. 1850–1945): eletricidade, petróleo, aço, química, motor a combustão; linha de montagem (fordismo); expansão para EUA, Alemanha, França e Japão.

4. Consequências sociais
- Urbanização acelerada e cidades insalubres.
- Formação do proletariado: jornadas de 14 a 16 horas, trabalho infantil e feminino com salários menores.
- Movimentos operários: ludismo (quebra de máquinas), cartismo (direitos políticos) e sindicatos (trade unions).
- Surgimento de ideias socialistas (Marx e Engels) como crítica ao capitalismo industrial.

5. Consequências econômicas e ambientais
Aumento enorme da produção, barateamento de mercadorias, fortalecimento do capitalismo industrial e busca por mercados e matérias-primas (base do imperialismo do século XIX). Início da poluição em larga escala pela queima de carvão.`;

function wrap(text,max){ const words=String(text).split(/\s+/); const lines=[]; let l=""; for(const w of words){ if(!l) l=w; else if((l+" "+w).length<=max) l+=" "+w; else { lines.push(l); l=w; } } if(l) lines.push(l); return lines; }
function mapaSVG(mm){
  const W=700, BW=214, cores=["#1f6f6a","#d98e1c","#7a5cc2","#2f7d3e","#b33a2e","#2b5fa8","#8a6d1f","#4a7f8c"];
  const ramos=(mm.ramos||[]).slice(0,8);
  const boxes=ramos.map((r,i)=>{ const tl=wrap(r.titulo,26); const its=(r.itens||[]).slice(0,4).map(x=>wrap(x,34)); const h=14+tl.length*16+its.reduce((s,x)=>s+x.length*14,0)+(its.length?6:0)+8; return {r,i,tl,its,h,cor:cores[i%cores.length],side:i%2===0?"R":"L"}; });
  const cols={L:boxes.filter(b=>b.side==="L"),R:boxes.filter(b=>b.side==="R")};
  const gap=16; const colH=k=>cols[k].reduce((s,b)=>s+b.h,0)+gap*Math.max(0,cols[k].length-1);
  const H=Math.max(280,Math.max(colH("L"),colH("R"))+40);
  for(const k of ["L","R"]){ let y=(H-colH(k))/2; cols[k].forEach(b=>{ b.y=y; b.x=k==="L"?6:W-BW-6; y+=b.h+gap; }); }
  const cx=W/2, cy=H/2, ctl=wrap(mm.centro||"Tema",16).slice(0,3);
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="'Source Sans 3', Arial, sans-serif">`;
  boxes.forEach(b=>{ const bx=b.side==="L"?b.x+BW:b.x, by=b.y+b.h/2, sx=b.side==="L"?cx-92:cx+92; const mx=(sx+bx)/2;
    s+=`<path d="M${sx},${cy} C${mx},${cy} ${mx},${by} ${bx},${by}" fill="none" stroke="${b.cor}" stroke-width="2.5"/>`; });
  boxes.forEach(b=>{ s+=`<rect x="${b.x}" y="${b.y}" width="${BW}" height="${b.h}" rx="8" fill="#fff" stroke="${b.cor}" stroke-width="2"/><rect x="${b.x}" y="${b.y}" width="${BW}" height="${10+b.tl.length*16}" rx="8" fill="${b.cor}"/><rect x="${b.x}" y="${b.y+b.tl.length*16}" width="${BW}" height="10" fill="${b.cor}"/>`;
    let y=b.y+19; b.tl.forEach(l=>{ s+=`<text x="${b.x+10}" y="${y}" font-size="13" font-weight="700" fill="#fff">${esc(l)}</text>`; y+=16; });
    y+=8; b.its.forEach(lines=>{ lines.forEach((l,j)=>{ s+=`<text x="${b.x+(j?20:10)}" y="${y}" font-size="11.5" fill="#222">${j?"":"• "}${esc(l)}</text>`; y+=14; }); }); });
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="96" ry="${30+ctl.length*9}" fill="#16223b"/>`;
  ctl.forEach((l,i)=>{ s+=`<text x="${cx}" y="${cy+5+(i-(ctl.length-1)/2)*18}" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">${esc(l)}</text>`; });
  return s+"</svg>";
}

/* ================== UPLOAD / EXTRAÇÃO ================== */
async function extrairTexto(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(ext==="txt"||ext==="md") return await file.text();
  if(ext==="pdf"){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
    const pdf = await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    let out=[];
    for(let p=1;p<=Math.min(pdf.numPages,80);p++){ const pg=await pdf.getPage(p); const tc=await pg.getTextContent(); let line="", lastY=null; const ls=[];
      tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); if(lastY!==null && Math.abs(y-lastY)>2){ ls.push(line); line=""; } line+=it.str; lastY=y; }); ls.push(line); out.push(ls.join("\n")); }
    return out.join("\n\n");
  }
  if(ext==="docx"){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const r = await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
    return r.value;
  }
  throw new Error("Formato não aceito. Use PDF, Word (.docx) ou texto (.txt).");
}
async function onUpload(aulaId, file){
  if(!file) return;
  toast("Lendo "+file.name+"…");
  try{

    if(texto.split(/\s+/).length<40) throw new Error("Quase não há texto neste arquivo. Se for um PDF escaneado (imagem), envie uma versão com texto selecionável.");
    const a=aulaById(aulaId); a.material={nome:file.name,tamanho:file.size,texto}; a.apostila=null; save(); render(); toast("Material anexado à aula.");
  }catch(e){ toast(e.message||"Não foi possível ler o arquivo."); }
}

/* ================== IA: GERAR APOSTILA ================== */
function promptApostila(aula){
  const t=turmaById(aula.turmaId), c=S.config;
  return `Você é um(a) professor(a) experiente de ${t.disciplina} do ${t.serie}, no Brasil. Um aluno faltou à aula sobre "${aula.tema}" e vai estudar SOZINHO, em casa, usando uma apostila impressa. Crie essa apostila a partir EXCLUSIVAMENTE do material da aula abaixo.

REGRAS
- Português do Brasil, linguagem clara e adequada ao ${t.serie}, falando diretamente com o aluno.
- "resumo": deve cobrir TODO o conteúdo do material, sem pular tópicos, explicado de forma didática para quem não assistiu à aula. Use de 4 a 7 seções; cada "texto" com 1 a 3 parágrafos separados por \\n. Inclua exemplos e fórmulas/datas que estejam no material.
- Não invente conteúdo que não esteja no material. Todas as questões devem poder ser respondidas com o resumo.
- "objetivas": exatamente ${c.objetivas} questões, cada uma com 4 alternativas (sem letras no texto), "correta" é o índice 0 a 3; varie a posição da correta; "explicacao" em 1 frase.
- "dissertativas": exatamente ${c.dissertativas} questões que peçam explicação, comparação ou aplicação; "resposta_esperada" em 1 a 3 frases.
- "conceitos": 5 a 8 termos importantes com definição curta (até 15 palavras).
- "mapa_mental": "centro" com até 3 palavras; 4 a 6 "ramos", cada um com "titulo" curto e 2 a 3 "itens" de no máximo 6 palavras.

Responda SOMENTE com um objeto JSON neste formato:
{"titulo":"...","objetivos":["..."],"resumo":[{"titulo":"...","texto":"..."}],"conceitos":[{"termo":"...","definicao":"..."}],"objetivas":[{"enunciado":"...","alternativas":["...","...","...","..."],"correta":0,"explicacao":"..."}],"dissertativas":[{"enunciado":"...","resposta_esperada":"..."}],"mapa_mental":{"centro":"...","ramos":[{"titulo":"...","itens":["...","..."]}]}}

MATERIAL DA AULA (${aula.material.nome}):
"""
${aula.material.texto.slice(0,60000)}
"""`;
}
function validar(ap){
  if(!ap || typeof ap!=="object" || !Array.isArray(ap.resumo) || !Array.isArray(ap.objetivas)) throw {code:"invalid_json"};
  ap.objetivas.forEach(q=>{ q.alternativas=(q.alternativas||[]).slice(0,5).map(x=>String(x).replace(/^\s*[A-Ea-e][\)\.]\s*/,"")); q.correta=Math.min(Math.max(0,parseInt(q.correta)||0),q.alternativas.length-1); });
  ap.dissertativas=ap.dissertativas||[]; ap.conceitos=ap.conceitos||[]; ap.objetivos=ap.objetivos||[];
  ap.mapa_mental=ap.mapa_mental||{centro:"",ramos:[]};
  return ap;
}

async function salvarChamada(aulaId){
  const a=aulaById(aulaId), t=turmaById(a.turmaId);
  a.salva=true;
  const faltosos=t.alunos.filter(al=>a.chamada[al.id]==="F").map(al=>al.id);
  const novos=faltosos.filter(id=>!a.enviados.includes(id));
  save();
  if(!novos.length){ run=null; render(); toast(faltosos.length?"Chamada salva. Os faltosos já tinham recebido apostila.":"Chamada salva. Ninguém faltou."); return; }
  run={aulaId, steps:[
    {t:`Falta registrada: ${novos.length} aluno${novos.length>1?"s":""}`, d:novos.map(id=>alunoById(id).nome).join(", "), state:"done"},
    {t:"Lendo o material da aula", d:a.material?a.material.nome:"", state:"run"},
    {t:"IA gerando a apostila", d:"Resumo do conteúdo, questões objetivas, dissertativas e mapa mental", state:"", stream:false},
    {t:"Montando um documento por aluno", d:"", state:""},
    {t:"Enviando para a Secretaria", d:S.config.emailSecretaria, state:""}
  ]};
  render();
  if(!a.material){ run.steps[1].state="err"; run.steps[1].d="Esta aula não tem material anexado."; run.error="Anexe o conteúdo da aula (PDF, Word ou texto) e salve a chamada de novo. A chamada já foi salva."; render(); return; }
  await new Promise(r=>setTimeout(r,500));
  run.steps[1].state="done"; run.steps[1].d=`${a.material.nome} · ${a.material.texto.split(/\s+/).length.toLocaleString("pt-BR")} palavras`;
  let ap=a.apostila;
  if(ap){ run.steps[2].state="done"; run.steps[2].d="Esta aula já tinha apostila gerada; o sistema reaproveita a mesma para os novos faltosos."; render(); }
  else if(!sampleFn && capsReady && APOSTILAS_PRONTAS[a.id]){
    run.steps[2].state="run"; render();
    for(const f of ["Escrevendo o resumo do conteúdo","Separando os conceitos-chave","Criando questões objetivas","Criando questões dissertativas","Montando o mapa mental"]){ run.steps[2].d=f+"…"; const sd=document.querySelectorAll(".step .sd")[2]; if(sd) sd.textContent=run.steps[2].d; await espera(800); }
    ap=JSON.parse(JSON.stringify(APOSTILAS_PRONTAS[a.id])); a.apostila=ap;
    run.steps[2].state="done"; run.steps[2].d=`Exemplo já gerado pela IA · ${ap.resumo.length} seções de resumo · ${ap.objetivas.length} objetivas · ${ap.dissertativas.length} dissertativas · mapa mental`;
  }
  else{
    if(!sampleFn){ run.steps[2].state="err"; run.error = capsReady?(SITE?"No site de demonstração a IA está desligada e mostra só exemplos prontos. Teste com as aulas Respiração celular (1º ano A) ou Revolução Industrial (2º ano B), com o material original.":"A IA não está disponível nesta visualização."):"Ainda conectando à IA. Aguarde alguns segundos e salve a chamada de novo."; render(); return; }
    run.steps[2].state="run"; run.steps[2].stream=true; run.streamTail=""; render();
    const ctl=new AbortController(); run.ctl=ctl;
    const fases=[["\"mapa_mental\"","Montando o mapa mental"],["\"dissertativas\"","Criando questões dissertativas"],["\"objetivas\"","Criando questões objetivas"],["\"conceitos\"","Separando os conceitos-chave"],["\"resumo\"","Escrevendo o resumo do conteúdo"]];
    try{
      ap = await sampleFn.json(promptApostila(a),{signal:ctl.signal,cache:false,onText:({text})=>{
        run.streamTail=text.slice(-600);
        const f=fases.find(([k])=>text.includes(k)); run.steps[2].d=(f?f[1]:"Começando")+` · ${text.length.toLocaleString("pt-BR")} caracteres escritos`;
        const st=document.getElementById("stream"); if(st) st.textContent=run.streamTail;
        const sd=document.querySelectorAll(".step .sd")[2]; if(sd) sd.textContent=run.steps[2].d;
      }});
      ap=validar(ap);
    }catch(e){
      run.steps[2].state="err"; run.steps[2].stream=false;
      if(e && e.code==="cancelled"){ run.error="Geração interrompida. A chamada foi salva; salve de novo para gerar a apostila."; }
      else run.error=ERROS[e?.code]||"Falha temporária na IA. Salve a chamada de novo para tentar outra vez.";
      render(); return;
    }
    a.apostila=ap; run.steps[2].state="done"; run.steps[2].stream=false; run.steps[2].d=`${ap.resumo.length} seções de resumo · ${ap.objetivas.length} objetivas · ${ap.dissertativas.length} dissertativas · mapa mental com ${(ap.mapa_mental.ramos||[]).length} ramos`;
  }
  run.steps[3].state="run"; render();
  await new Promise(r=>setTimeout(r,600));
  run.steps[3].state="done"; run.steps[3].d=novos.map(id=>nomeArquivo(alunoById(id),a)).join(" · ");
  run.steps[4].state="run"; render();
  await new Promise(r=>setTimeout(r,500));
  const em={id:"e"+Date.now(),quando:new Date().toISOString(),aulaId,alunos:novos,lido:false,impressos:{}};
  S.emails.push(em); a.enviados.push(...novos); S.ui.emailId=em.id;
  run.steps[4].state="done"; run.done=true; run.n=novos.length; save(); render();
}

/* --- visão computacional: marcadores, homografia, bolhas --- */
function homografia(src,dst){
  const A=[],b=[];
  for(let i=0;i<4;i++){ const [x,y]=src[i],[u,v]=dst[i]; A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u); A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v); }
  for(let c=0;c<8;c++){ let p=c; for(let r=c+1;r<8;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r; [A[c],A[p]]=[A[p],A[c]]; [b[c],b[p]]=[b[p],b[c]];
    for(let r=0;r<8;r++){ if(r===c) continue; const f=A[r][c]/A[c][c]; for(let k=c;k<8;k++) A[r][k]-=f*A[c][k]; b[r]-=f*b[c]; } }
  return b.map((v,i)=>v/A[i][i]);
}
const aplicaH=(h,x,y)=>{ const w=h[6]*x+h[7]*y+1; return [(h[0]*x+h[1]*y+h[2])/w,(h[3]*x+h[4]*y+h[5])/w]; };

  const R=Math.max(8,Math.round(Math.min(W,H)/14)), bin=new Uint8Array(N);
  for(let y=0;y<H;y++){ const y0=Math.max(0,y-R), y1=Math.min(H,y+R+1);
    for(let x=0;x<W;x++){ const x0=Math.max(0,x-R), x1=Math.min(W,x+R+1);
      const s=I[y1*W1+x1]-I[y0*W1+x1]-I[y1*W1+x0]+I[y0*W1+x0], mean=s/((x1-x0)*(y1-y0)), v=g[y*W+x];
      bin[y*W+x]= (v<mean*0.72 && v<165) ? 1:0; } }
  const lab=new Int32Array(N), st=new Int32Array(N), comps=[]; let nl=0;
  for(let i=0;i<N;i++){ if(!bin[i]||lab[i]) continue; nl++; let sp=0; st[sp++]=i; lab[i]=nl; let mnx=1e9,mxx=-1,mny=1e9,mxy=-1,cnt=0,sx=0,sy=0;
    while(sp){ const k=st[--sp], x=k%W, y=(k/W)|0; cnt++; sx+=x; sy+=y; if(x<mnx)mnx=x; if(x>mxx)mxx=x; if(y<mny)mny=y; if(y>mxy)mxy=y;
      if(x>0&&bin[k-1]&&!lab[k-1]){lab[k-1]=nl;st[sp++]=k-1;} if(x<W-1&&bin[k+1]&&!lab[k+1]){lab[k+1]=nl;st[sp++]=k+1;}
      if(y>0&&bin[k-W]&&!lab[k-W]){lab[k-W]=nl;st[sp++]=k-W;} if(y<H-1&&bin[k+W]&&!lab[k+W]){lab[k+W]=nl;st[sp++]=k+W;} }
    const w=mxx-mnx+1,h=mxy-mny+1; comps.push({w,h,cnt,cx:sx/cnt,cy:sy/cnt}); }
  const md=Math.min(W,H);
  const cand=comps.filter(c=>c.w>=8&&c.h>=8&&c.w>md*0.012&&c.w<md*0.11&&c.h<md*0.11&&c.w/c.h>0.6&&c.w/c.h<1.65&&c.cnt/(c.w*c.h)>0.82);
  if(cand.length<4) return {ok:false,g,bin,W,H};

  const TL=pick(c=>-(c.cx+c.cy)), TR=pick(c=>c.cx-c.cy), BL=pick(c=>c.cy-c.cx), BR=pick(c=>c.cx+c.cy);

function lerBolhas(an, lay, p){
  const fr={};

    for(let dy=-1.9;dy<=1.9;dy+=0.3) for(let dx=-1.9;dx<=1.9;dx+=0.3){ if(dx*dx+dy*dy>3.61) continue; const [u,v]=aplicaH(an.h,b.x+dx,b.y+dy); const ui=Math.round(u), vi=Math.round(v); if(ui<0||vi<0||ui>=an.W||vi>=an.H) continue; n++; dk+=an.bin[vi*an.W+ui]; }
    (fr[b.q] ||= [])[b.j]= n? dk/n : 0; }
  return p.objetivas.map((q,i)=>{ const f=fr[i]||[]; const idx=f.map((v,j)=>[v,j]).sort((a,b)=>b[0]-a[0]); const [m1,j1]=idx[0]||[0,0], m2=idx[1]?.[0]||0;
    if(m1<0.12) return {marcada:-1,leitura:"ok"};
    if(m1>=0.3 && m2>=0.3 && m2>m1*0.6) return {marcada:-2,leitura:"duvidosa"};
    return {marcada:j1, leitura:(m1>=0.3 && m1-m2>=0.2)?"ok":"duvidosa"}; });
}
function warpCanvas(src, h, x0,y0,w,hh,ppm){
  const ow=Math.round(w*ppm), oh=Math.round(hh*ppm), c=document.createElement("canvas"); c.width=ow; c.height=oh;

  render(); if(processarFotos.rodando) return; processarFotos.rodando=true;

}

          const r=await sampleFn.json(promptFolhaInteira(p,t),{images:[await canvasBlob(cv,0.85)],cache:false});

          const mk=Array.isArray(r?.marcadas)?r.marcadas:[];
          res.objetivas=p.objetivas.map((q,i)=>{ const m=mk.find(x=>+x.questao===i+1); const a=m?.alternativa; if(a==null||a==="") return {marcada:-1,leitura:"ia"}; if(String(a).toLowerCase().startsWith("mult")) return {marcada:-2,leitura:"ia"}; const j=LETRAS.indexOf(String(a).trim().toUpperCase()[0]); return {marcada:j>=0?j:-1,leitura:"ia"}; });
          res.aviso="Os quatro quadrados pretos não apareceram na foto, então a IA leu a folha inteira, inclusive as objetivas. Confira com atenção.";

function promptLerProva(t, texto){ return `Você é professor(a) de ${t.disciplina} do ${t.serie}. Abaixo está o texto de uma prova. Organize-a para correção.

- Objetivas: "alternativas" sem as letras; "correta" é o índice (0 = A). Se a prova não indicar o gabarito, resolva você e marque "gabarito_ia": true.
- Dissertativas: escreva a "resposta_esperada" (1 a 3 frases) e de 2 a 3 "criterios" objetivos de correção com pontos (use múltiplos de 0,5). Se a prova indicar o valor da questão, distribua esse valor entre os critérios; senão, use 2 pontos no total.
- Objetivas valem 1 ponto, a menos que a prova diga outro valor.
- "titulo": nome curto da prova.

Responda SOMENTE com JSON:
{"titulo":"...","objetivas":[{"enunciado":"...","alternativas":["...","...","...","..."],"correta":0,"gabarito_ia":false,"pontos":1}],"dissertativas":[{"enunciado":"...","resposta_esperada":"...","criterios":[{"descricao":"...","pontos":1}]}]}

TEXTO DA PROVA:
"""
${texto.slice(0,50000)}
"""`; }

    return `<tr><td>${i+1}</td><td><select data-rvobj="${i}" aria-label="Marcação da questão ${i+1}" ${done?"disabled":""}>${[...q.alternativas.map((_,j)=>j),-1,-2].map(v=>`<option value="${v}" ${o.marcada===v?"selected":""}>${marcaTxt(v)}</option>`).join("")}</select></td>
      <td>${LETRAS[q.correta]}</td><td>${o.leitura==="duvidosa"?'<span class="pill warn">Confira</span>':o.leitura==="ia"?'<span class="pill ac">Lida pela IA</span>':o.leitura==="professor"?'<span class="pill">Ajustada</span>':'<span class="pill ok">Leitura automática</span>'}</td>
      <td style="text-align:right;font-variant-numeric:tabular-nums">${ok?`<span style="color:var(--ok);font-weight:700">+${fmtN(+q.pontos)}</span>`:`<span class="sub">0</span>`}</td></tr>`; }).join("");
  const dis=p.dissertativas.map((q,i)=>{ const d=r.dissertativas[i]; const max=ptsDiss(q); const att=d.legibilidade==="ilegivel"||d.legibilidade==="dificil"||d.nota_sugerida==null;
    return `<div class="dcard ${att&&!done?"attn":""}"><div class="qh" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-family:var(--font-display)">Questão ${n+i+1}</b><span class="sub" style="font-size:13px">vale ${fmtN(max)}</span>
        ${d.legibilidade==="ilegivel"?'<span class="pill bad">Letra ilegível para a IA</span>':d.legibilidade==="dificil"?'<span class="pill warn">Letra difícil</span>':d.legibilidade?'<span class="pill ok">Letra legível</span>':""}</div>
      <div class="sub" style="font-size:13.5px">${esc(q.enunciado)}</div>
      ${r.modo==="folha"?`<img class="crop" data-img="${key}|d${i}" alt="Resposta manuscrita da questão ${n+i+1}">`:""}
      ${d.transcricao||d.legibilidade?`<div><div class="label" style="margin-bottom:4px">O que a IA leu</div><div class="transc">${d.transcricao?realcar(d.transcricao):'<span class="sub">(em branco)</span>'}</div></div>`:""}
      ${d.criterios?.length?`<ul class="crit-list">${d.criterios.map(c=>`<li><span>${esc(c.descricao)}</span>${c.avaliacao==="sim"?'<span class="pill ok">Atendeu</span>':c.avaliacao==="parcial"?'<span class="pill warn">Parcial</span>':'<span class="pill bad">Não atendeu</span>'}<span style="font-variant-numeric:tabular-nums;font-weight:600">${fmtN(+c.pontos)}</span></li>`).join("")}</ul>`:""}
      ${d.justificativa?`<div style="font-size:14px"><b>Sugestão da IA:</b> ${esc(d.justificativa)}</div>`:""}
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
        <div><label class="label" for="nota-${i}">Nota</label><div style="display:flex;gap:6px;align-items:center"><input class="nota-in" type="number" id="nota-${i}" min="0" max="${max}" step="0.25" value="${d.nota_final??d.nota_sugerida??""}" placeholder="—" data-rvnota="${i}" ${done?"disabled":""}><span class="sub">de ${fmtN(max)}</span></div>
          <div class="sub" style="font-size:12px;margin-top:2px">${d.nota_sugerida!=null?`IA sugeriu ${fmtN(d.nota_sugerida)}`:"Sem sugestão da IA"}</div></div>
        <div style="flex:1;min-width:200px"><label class="label" for="com-${i}">Comentário para o aluno (opcional)</label><input type="text" id="com-${i}" style="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface)" value="${esc(d.comentario||"")}" data-rvcom="${i}" ${done?"disabled":""}></div></div></div>`; }).join("");
  return `<div class="stack" style="gap:14px">
    <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
      <img class="thumb" data-img="${key}|${r.modo==="folha"?"folha":"foto"}" alt="Folha fotografada" data-zoom="${key}|${r.modo==="folha"?"folha":"foto"}">
      <div style="flex:1;min-width:200px"><h2 style="font-size:20px">${esc(al.nome)}</h2><div class="sub" style="font-size:13px">${al.matricula} · enviada ${fmtQuando(r.quando)}</div>
        <div class="bigtotal" style="margin-top:6px">${fmtN(nt.t)} <span class="sub" style="font-size:16px;font-weight:600">de ${fmtN(totalProva(p))}</span></div>
        <div class="sub" style="font-size:13px">Objetivas ${fmtN(nt.o)} · Dissertativas ${fmtN(nt.d)}${nt.pend?" · falta nota":""}</div>
        <div class="pills" style="margin-top:6px">${done?'<span class="pill ok">Nota confirmada pelo professor</span>':atn.length?atn.map(a=>`<span class="pill warn">Atenção: ${a}</span>`).join(""):'<span class="pill ok">Sem pontos de atenção</span>'}</div></div></div>
    ${r.aviso?`<div class="alert warn">${esc(r.aviso)}</div>`:""}
    ${n?`<div><div class="label" style="margin-bottom:6px">Objetivas · corrigidas automaticamente</div><div class="scroll-x"><table class="objtab"><thead><tr><th>Questão</th><th>Marcou</th><th>Gabarito</th><th>Leitura</th><th style="text-align:right">Pontos</th></tr></thead><tbody>${objRows}</tbody></table></div></div>`:""}
    ${p.dissertativas.length?`<div class="label">Dissertativas · avaliadas pela IA, nota final sua</div>${dis}`:""}
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px"><div style="flex:1"><b>Nota final: ${fmtN(nt.t)}</b></div>
      ${done?`<button class="btn" data-reabrir="${alunoId}">Reabrir para ajustar</button>`:`<button class="btn primary" data-confirmar="${alunoId}" ${nt.pend?"disabled title='Dê nota a todas as dissertativas'":""}>Confirmar nota</button>`}</div>
  </div>`;
}
async function hydrateProvas(){
  document.querySelectorAll("img[data-img]").forEach(async im=>{ const v=await imgGet(im.dataset.img); if(v) im.src=v; else im.alt="Imagem não disponível neste navegador"; });
  const c=document.getElementById("sheet-prev");
  if(c){ try{ await loadScript(LIB_QR); const p=provaById(S.ui.provaId), t=turmaById(p.turmaId); drawSheet(c.getContext("2d"),sheetLayout(p,t.alunos[0],t),3); }catch(e){} }
}
function abrirZoom(k){ imgGet(k).then(v=>{ if(!v) return; $("#modal-root").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Foto da folha"><div class="modal-card"><div class="modal-bar"><h3>Folha enviada</h3><div class="spacer"></div><button class="btn small" id="close-mdl">Fechar</button></div><div class="modal-body" style="background:var(--surface)"><img src="${v}" alt="Folha enviada" style="width:100%"></div></div></div>`; }); }

document.addEventListener("click", ev=>{
  const el=ev.target.closest("button,img[data-zoom]"); if(!el) return; const d=el.dataset;
  if(d.zoom){ abrirZoom(d.zoom); return; }
  if(d.prova){ S.ui.provaId=d.prova; S.ui.rvAluno=null; save(); render(); return; }
  if(d.step){ S.ui.provaStep=d.step; save(); render(); window.scrollTo(0,0); return; }
  if(d.novaprova){ openNovaProva(d.novaprova); return; }
  const p=provaById(S.ui.provaId);
  if(d.addobj){ p.objetivas.push({enunciado:"",alternativas:["","","",""],correta:0,pontos:1}); save(); render(); return; }
  if(d.adddis){ p.dissertativas.push({enunciado:"",resposta_esperada:"",criterios:[{descricao:"",pontos:1}]}); save(); render(); return; }
  if(d.delobj){ p.objetivas.splice(+d.delobj,1); save(); render(); return; }
  if(d.deldis){ p.dissertativas.splice(+d.deldis,1); save(); render(); return; }
  if(d.addcrit){ p.dissertativas[+d.addcrit].criterios.push({descricao:"",pontos:0.5}); save(); render(); return; }
  if(d.delcrit){ const [i,k]=d.delcrit.split("|").map(Number); p.dissertativas[i].criterios.splice(k,1); save(); render(); return; }
  if(d.dlfolhas){ baixarFolhas(provaById(d.dlfolhas),el); return; }
  if(d.dlcaderno){ baixarCaderno(provaById(d.dlcaderno),el); return; }
  if(d.rvaluno){ S.ui.rvAluno=d.rvaluno; save(); render(); return; }
  if(d.confirmar){ const r=resultadosDe(p.id)[d.confirmar]; r.status="confirmada"; r.confirmadaEm=new Date().toISOString(); save(); toast("Nota confirmada e lançada no boletim.");
    const t=turmaById(p.turmaId), rs=resultadosDe(p.id), prox=t.alunos.find(a=>rs[a.id]&&rs[a.id].status!=="confirmada"); if(prox) S.ui.rvAluno=prox.id; render(); return; }
  if(d.reabrir){ resultadosDe(p.id)[d.reabrir].status="revisar"; save(); render(); return; }
  if(d.simular){ (async()=>{ const pr=provaById(d.simular), t=turmaById(pr.turmaId), rs=resultadosDe(pr.id); const emFila=new Set(fila.filter(f=>!f.fim).map(f=>f.alunoAlvo));
      const idx=t.alunos.findIndex(a=>!rs[a.id]&&!emFila.has(a.id)); if(idx<0){ toast("Todos os alunos já têm folha enviada."); return; }
      el.disabled=true; try{ const blob=await fotoExemplo(pr,t.alunos[idx],idx); blob.name="foto-exemplo.jpg"; const f=new File([blob],`foto_exemplo_${slug(t.alunos[idx].nome)}.jpg`,{type:"image/jpeg"}); processarFotos(pr.id,[f]); fila[fila.length-1].alunoAlvo=t.alunos[idx].id; if(pr.id==="pv1") fila[fila.length-1].perfil=idx%3; }
      catch(e){ toast("Não foi possível montar a foto de exemplo."); } finally{ el.disabled=false; } })(); return; }
});
document.addEventListener("input", ev=>{
  const el=ev.target, d=el.dataset; const p=provaById(S.ui.provaId); if(!p) return;
  if(d.pq){ const [tp,i,f,a,b]=d.pq.split("|"); const q=(tp==="o"?p.objetivas:p.dissertativas)[+i];
    if(f==="alt") q.alternativas[+a]=el.value; else if(f==="crit") q.criterios[+a][b]= b==="pontos"?(+el.value||0):el.value; else q[f]= f==="pontos"?(+el.value||0):el.value;
    save();
    const tt=document.getElementById("prova-total"); if(tt) tt.textContent=fmtN(totalProva(p));
    if(tp==="d"){ const dt=document.querySelector(`[data-dtot="${i}"]`); if(dt) dt.textContent=fmtN(ptsDiss(q)); }
    return; }
  if(d.rvcom!=null && d.rvcom!==""){ const r=resultadosDe(p.id)[S.ui.rvAluno]; r.dissertativas[+d.rvcom].comentario=el.value; save(); return; }
});
document.addEventListener("change", ev=>{
  const el=ev.target, d=el.dataset; const p=provaById(S.ui.provaId);
  if(el.id==="prof-sel-m"){ S.ui.profId=el.value; S.ui.aulaId=null; S.ui.provaId=null; if(run&&(run.done||run.error)) run=null; save(); render(); return; }
  if(el.id==="mob-aula"){ S.ui.aulaId=el.value; if(run && run.aulaId!==el.value && (run.done||run.error)) run=null; save(); render(); return; }
  if(el.id==="mob-prova"){ S.ui.provaId=el.value; S.ui.rvAluno=null; save(); render(); return; }
  if(el.id==="mob-rv-sel"){ S.ui.rvAluno=el.value; save(); render(); return; }
  if(d.cor){ const [i,j]=d.cor.split("|").map(Number); p.objetivas[i].correta=j; p.objetivas[i].iaGabarito=false; save(); render(); return; }
  if(d.fotos){ const files=[...el.files]; el.value=""; if(files.length) processarFotos(d.fotos,files); return; }
  if(d.rvobj!=null && d.rvobj!==""){ const r=resultadosDe(p.id)[S.ui.rvAluno]; r.objetivas[+d.rvobj]={marcada:+el.value,leitura:"professor"}; save(); render(); return; }
  if(d.rvnota!=null && d.rvnota!==""){ const r=resultadosDe(p.id)[S.ui.rvAluno]; const max=ptsDiss(p.dissertativas[+d.rvnota]); let v=el.value===""?null:Math.min(max,Math.max(0,+el.value)); r.dissertativas[+d.rvnota].nota_final=v; save(); render(); return; }
});

/* ================== EVENTOS ================== */
document.addEventListener("click", ev=>{
  const el=ev.target.closest("button,[data-goto]"); if(!el) return;
  const d=el.dataset;
  if(d.view){ S.ui.view=d.view; save(); render(); window.scrollTo(0,0); return; }
  if(d.goto){ S.ui.view=d.goto; save(); render(); window.scrollTo(0,0); return; }
  if(d.aula && el.classList.contains("aula-item")){ S.ui.aulaId=d.aula; if(run && run.aulaId!==d.aula && (run.done||run.error)) run=null; save(); render(); return; }
  if(d.pres){ const a=aulaById(S.ui.aulaId); a.chamada[d.pres]=d.v; save(); render(); return; }
  if(d.todos){ const a=aulaById(d.todos); Object.keys(a.chamada).forEach(k=>a.chamada[k]="P"); save(); render(); return; }
  if(d.salvar){ salvarChamada(d.salvar); return; }
  if(d.nova){ openNovaAula(d.nova); return; }
  if(d.preview){ openPreview(d.preview,null,null); return; }
  if(d.email){ S.ui.emailId=d.email; save(); render(); return; }
  if(d.abrir){ const [eid,aid]=d.abrir.split("|"); const e=S.emails.find(x=>x.id===eid); openPreview(e.aulaId,aid,eid); return; }
  if(el.id==="stop"){ run?.ctl?.abort(); return; }
  if(el.id==="close-mdl"){ closeModal(); return; }
  if(el.id==="dl-pdf"){ baixarPDF(d.aula,d.aluno||null,el); return; }
  if(el.id==="mk-imp"){ const e=S.emails.find(x=>x.id===d.e); e.impressos[d.a]=!e.impressos[d.a]; save(); el.textContent=e.impressos[d.a]?"Desmarcar impresso":"Marcar como impresso"; render(); toast(e.impressos[d.a]?"Marcado como impresso.":"Marcação removida."); return; }
  if(el.id==="reset"){ $("#modal-root").innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-card small-modal"><div class="modal-bar"><h3>Reiniciar a demonstração?</h3></div><div class="modal-body"><p style="margin:0">Volta tudo ao estado inicial: aulas, chamadas, apostilas geradas e e-mails.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="close-mdl">Cancelar</button><button class="btn primary" id="do-reset">Reiniciar</button></div></div></div></div>`; return; }
  if(el.id==="do-reset"){ run?.ctl?.abort(); run=null; fila.length=0; imgClear(); S=seed(); save(); closeModal(); render(); toast("Demonstração reiniciada."); return; }
});
document.addEventListener("click", ev=>{ if(ev.target.classList?.contains("modal")) closeModal(); });
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape") closeModal(); });
document.addEventListener("change", ev=>{
  const el=ev.target;
  if(el.id==="prof-sel"){ S.ui.profId=el.value; S.ui.aulaId=null; if(run&&(run.done||run.error)) run=null; save(); render(); return; }
  if(el.dataset.upload){ onUpload(el.dataset.upload, el.files[0]); return; }
  if(el.dataset.cf){ const k=el.dataset.cf; let v=el.value; if(k==="objetivas"||k==="dissertativas") v=+v; if(k==="gabarito") v=v==="1"; S.config[k]=v; save(); if(k!=="escola"&&k!=="emailSecretaria") render(); else $("#escola-nome").textContent=S.config.escola; toast("Configuração salva."); }
});
document.addEventListener("dragover", ev=>{ const z=ev.target.closest("[data-drop]"); if(z){ ev.preventDefault(); z.classList.add("over"); } });
document.addEventListener("dragleave", ev=>{ const z=ev.target.closest("[data-drop]"); if(z) z.classList.remove("over"); });
document.addEventListener("drop", ev=>{ const z=ev.target.closest("[data-drop]"); if(z){ ev.preventDefault(); onUpload(z.dataset.drop, ev.dataTransfer.files[0]); } });

render();
</script>
</body>
